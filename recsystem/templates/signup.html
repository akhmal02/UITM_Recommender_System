{% extends "base.html" %}
{% from "macros.html" import brand %}
{% block title %}Sign Up{% endblock %}

{% block body %}
<div class="auth-container">
    <div class="auth-card card card-glass">
        <div style="margin-bottom: 28px;">{{ brand() }}</div>
        <h1>Create your account</h1>
        <p class="subtitle">Join CourseRec and get smart recommendations in minutes.</p>

        <form method="POST" action="{{ url_for('signup') }}">
            <div class="form-group">
                <label for="full_name">
                    <span class="material-symbols-outlined">badge</span>
                    Full name
                </label>
                <input type="text" id="full_name" name="full_name" class="form-control" placeholder="John Doe" required autofocus>
            </div>
            <div class="form-group">
                <label for="email">
                    <span class="material-symbols-outlined">mail</span>
                    Email address
                </label>
                <input type="email" id="email" name="email" class="form-control" placeholder="you@university.edu" required>
            </div>
            <div class="form-group">
                <label for="password">
                    <span class="material-symbols-outlined">lock</span>
                    Password
                </label>
                <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 characters" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm_password">
                    <span class="material-symbols-outlined">lock_reset</span>
                    Confirm password
                </label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
            </div>
            <button type="submit" class="btn btn-gemini btn-block">
                <span class="material-symbols-outlined">person_add</span>
                Create account
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
