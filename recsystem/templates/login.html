{% extends "base.html" %}
{% from "macros.html" import brand %}
{% block title %}Log In{% endblock %}

{% block body %}
<div class="auth-container">
    <div class="auth-card card card-glass">
        <div style="margin-bottom: 28px;">{{ brand() }}</div>
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to access your personalized recommendations.</p>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="email">
                    <span class="material-symbols-outlined">mail</span>
                    Email address
                </label>
                <input type="email" id="email" name="email" class="form-control" placeholder="you@university.edu" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">
                    <span class="material-symbols-outlined">lock</span>
                    Password
                </label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-gemini btn-block">
                <span class="material-symbols-outlined">login</span>
                Sign in
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('signup') }}">Create one</a>
        </div>
    </div>
</div>
{% endblock %}
